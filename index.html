<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Life Cover Smart Routes - Driver Safety & Navigation</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    html, body, #map { height: 100%; width: 100vw; overflow: hidden; background: #0f172a; }
    
    /* Toggle Button for Mobile Screen */
    .menu-toggle-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1001;
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      cursor: pointer;
    }

    /* Collapsible Glass Control Panel */
    .control-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      padding: 16px;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -5px 25px rgba(0,0,0,0.6);
      max-height: 80vh;
      overflow-y: auto;
      color: #f8fafc;
      border-top: 1px solid rgba(255,255,255,0.15);
      transition: transform 0.3s ease-in-out;
    }

    .control-panel.hidden {
      transform: translateY(100%);
    }

    .app-brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; }
    .app-brand h2 { font-size: 16px; font-weight: 800; color: #ffffff; }
    .app-brand span { color: #38bdf8; }
    
    .input-group { margin-bottom: 8px; }
    .input-group label { display: block; font-size: 10px; color: #94a3b8; margin-bottom: 2px; font-weight: 700; text-transform: uppercase; }
    .input-group input { width: 100%; padding: 8px 10px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; font-size: 13px; color: #fff; outline: none; }

    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
    
    .btn { display: block; width: 100%; padding: 10px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; text-align: center; font-size: 12px; }
    .btn-gps { background: #f59e0b; color: #0f172a; grid-column: span 2; }
    .btn-main { background: #0284c7; color: white; }
    .btn-bypass { background: #10b981; color: white; }
    .btn-sos { background: #ef4444; color: white; margin-top: 8px; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); }

    .toggle-group { margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; }
    .toggle-group h4 { font-size: 11px; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase; }
    .toggle-item { display: flex; align-items: center; justify-content: space-between; margin: 4px 0; font-size: 12px; color: #cbd5e1; }
    
    .info-card { margin-top: 8px; padding: 8px 10px; background: #1e293b; border-radius: 8px; font-size: 12px; border-left: 4px solid #38bdf8; }

    /* Emergency SOS Modal Overlay */
    .sos-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(185, 28, 28, 0.96); z-index: 9999; color: white; text-align: center; padding: 40px 20px; }
    .sos-overlay h1 { font-size: 26px; font-weight: 900; }
    .countdown-circle { font-size: 56px; font-weight: 900; margin: 20px auto; width: 110px; height: 110px; line-height: 100px; border: 4px solid white; border-radius: 50%; }
    .btn-cancel-sos { background: white; color: #dc2626; padding: 12px 24px; font-size: 15px; border-radius: 30px; border: none; font-weight: 800; }
  </style>
</head>
<body>

  <!-- Map Controls Toggle Button -->
  <button class="menu-toggle-btn" onclick="togglePanel()">⚙️ Controls / Map View</button>

  <!-- Emergency SOS Overlay Modal -->
  <div class="sos-overlay" id="sosModal">
    <h1>🚨 ACCIDENT DETECTED!</h1>
    <p>Crash detect hua hai.</p>
    <div class="countdown-circle" id="countdownSec">10</div>
    <button class="btn-cancel-sos" onclick="cancelAccidentAlert()">MAIN SURAKSHIT HOON (CANCEL)</button>
  </div>

  <div class="control-panel" id="controlPanel">
    <div class="app-brand">
      <h2>🛡️ LIFE COVER <span>Smart Routes</span></h2>
    </div>
    
    <div class="input-group">
      <label>Start Location:</label>
      <input type="text" id="startLocation" value="Delhi">
    </div>
    
    <div class="input-group">
      <label>Destination:</label>
      <input type="text" id="endLocation" value="Chandigarh">
    </div>

    <button class="btn btn-gps" onclick="detectUserLocation()">📍 Use Live GPS Location</button>
    
    <div class="btn-grid">
      <button class="btn btn-main" onclick="calculateRoute(false)">🚀 Safe Route</button>
      <button class="btn btn-bypass" onclick="calculateRoute(true)">🛡️ Avoid Toll</button>
    </div>

    <div class="toggle-group">
      <h4>Safety Features:</h4>
      <div class="toggle-item">
        <span>💥 Crash Sensor</span>
        <input type="checkbox" id="toggleCrashDetection" checked onchange="toggleSensor()">
      </div>
      <div class="toggle-item">
        <span>🛑 Police Naka / Toll</span>
        <input type="checkbox" id="togglePolice" checked onchange="toggleLayers()">
      </div>
    </div>

    <button class="btn btn-sos" onclick="triggerAccidentAlert()">🚨 MANUAL SOS (108 AMBULANCE)</button>

    <div class="info-card" id="routeInfo">
      Locations set karke "Safe Route" par click karein.
    </div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    const map = L.map('map', { zoomControl: false }).setView([28.6139, 77.2090], 7);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);

    const safetyGroup = L.layerGroup().addTo(map);
    let userCoords = null;
    let crashTimer = null;
    let currentRouteLayer = null;

    function togglePanel() {
      document.getElementById('controlPanel').classList.toggle('hidden');
    }

    function toggleLayers() {
      if(document.getElementById('togglePolice').checked) map.addLayer(safetyGroup); 
      else map.removeLayer(safetyGroup);
    }

    function detectUserLocation() {
      document.getElementById('routeInfo').innerHTML = "GPS Signal dhund raha hai...";
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            userCoords = [pos.coords.latitude, pos.coords.longitude];
            map.setView(userCoords, 13);
            L.marker(userCoords).addTo(map).bindPopup("Aapki Location").openPopup();
            document.getElementById('startLocation').value = "My Live Location";
            document.getElementById('routeInfo').innerHTML = "📍 GPS Location mil gayi hai!";
          },
          err => {
            alert("GPS Location access allow karein.");
            document.getElementById('routeInfo').innerHTML = "GPS Fail. City Name type karein.";
          },
          { enableHighAccuracy: true }
        );
      }
    }

    async function fetchCoords(query) {
      if(query.trim() === "My Live Location" && userCoords) {
        return { lat: userCoords[0], lon: userCoords[1] };
      }
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
      const data = await res.json();
      if(data && data.length > 0) return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
      throw new Error("Location nahi mili: " + query);
    }

    async function calculateRoute(avoidTolls) {
      const infoBox = document.getElementById('routeInfo');
      try {
        infoBox.innerHTML = "⏳ Rasta khoja ja raha hai...";
        
        const start = await fetchCoords(document.getElementById('startLocation').value);
        const end = await fetchCoords(document.getElementById('endLocation').value);

        let url = `https://router.project-osrm.org/route/v1/driving/${start.lon},${start.lat};${end.lon},${end.lat}?overview=full&geometries=geojson`;
        if(avoidTolls) url += `&exclude=toll`;

        const res = await fetch(url);
        const data = await res.json();

        if(data.routes && data.routes.length > 0) {
          const route = data.routes[0];
          const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);

          if(currentRouteLayer) map.removeLayer(currentRouteLayer);

          currentRouteLayer = L.polyline(coords, { 
            color: avoidTolls ? '#10b981' : '#0284c7', weight: 6, opacity: 0.8 
          }).addTo(map);

          map.fitBounds(currentRouteLayer.getBounds(), { padding: [30, 30] });

          infoBox.innerHTML = `<b>${avoidTolls ? '🛡️ Toll-Free Route' : '🚀 Standard Route'}</b><br>Duri: ${(route.distance/1000).toFixed(1)} km | Time: ${Math.round(route.duration/60)} min`;
          
          if(window.innerWidth < 768) {
            setTimeout(() => togglePanel(), 1200);
          }
        }
      } catch(err) {
        infoBox.innerHTML = "❌ Route error. Sahi city names (e.g. Delhi, Chandigarh) daalein.";
      }
    }

    function toggleSensor() {
      if(document.getElementById('toggleCrashDetection').checked && window.DeviceMotionEvent) {
        window.addEventListener('devicemotion', handleMotion);
      }
    }

    function handleMotion(event) {
      const acc = event.accelerationIncludingGravity;
      if (acc && Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2) > 35) {
        triggerAccidentAlert();
      }
    }

    function triggerAccidentAlert() {
      document.getElementById('sosModal').style.display = 'block';
      let c = 10;
      document.getElementById('countdownSec').innerText = c;
      clearInterval(crashTimer);
      crashTimer = setInterval(() => {
        c--;
        document.getElementById('countdownSec').innerText = c;
        if (c <= 0) {
          clearInterval(crashTimer);
          window.location.href = `tel:108`;
        }
      }, 1000);
    }

    function cancelAccidentAlert() {
      clearInterval(crashTimer);
      document.getElementById('sosModal').style.display = 'none';
    }
  </script>
</body>
</html>
