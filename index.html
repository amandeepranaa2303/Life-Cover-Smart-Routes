<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Life Cover - Google Style Navigation & Safety</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    html, body { height: 100%; width: 100vw; overflow: hidden; background: #e8eaed; }
    
    #map-wrapper { height: 100%; width: 100%; position: relative; }
    #map { height: 100%; width: 100%; }

    /* Top HUD Bar */
    .top-hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 1001;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .hud-left, .hud-right { display: flex; gap: 8px; pointer-events: auto; }

    .hud-btn {
      background: #ffffff;
      color: #3c4043;
      border: none;
      padding: 10px 16px;
      border-radius: 24px;
      font-weight: 600;
      font-size: 13px;
      box-shadow: 0 2px 6px rgba(60,64,67,0.3);
      cursor: pointer;
      transition: all 0.2s;
    }
    .hud-btn:active { background: #f1f3f4; }
    .hud-btn.active { background: #1a73e8; color: #white; }

    /* Control Panel (Google Maps Style Sheet) */
    .control-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: #ffffff;
      padding: 20px 16px;
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
      max-height: 80vh;
      overflow-y: auto;
      color: #202124;
      transition: transform 0.3s ease;
    }
    .control-panel.hidden { transform: translateY(100%); }

    .app-brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; border-bottom: 1px solid #e8eaed; padding-bottom: 8px; }
    .app-brand h2 { font-size: 16px; font-weight: 700; color: #1a73e8; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .input-group { margin-bottom: 10px; }
    .input-group label { display: block; font-size: 11px; color: #5f6368; margin-bottom: 4px; font-weight: 600; text-transform: uppercase; }
    .input-group input { width: 100%; padding: 12px; background: #f1f3f4; border: 1px solid #dadce0; border-radius: 8px; font-size: 14px; color: #202124; outline: none; }
    .input-group input:focus { border-color: #1a73e8; background: #fff; }

    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
    .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; text-align: center; font-size: 13px; }
    .btn-gps { background: #fbbc04; color: #202124; grid-column: span 2; font-weight: 700; }
    .btn-main { background: #1a73e8; color: white; }
    .btn-bypass { background: #34a853; color: white; }
    .btn-sos { background: #ea4335; color: white; margin-top: 10px; font-weight: 700; box-shadow: 0 2px 8px rgba(234,67,53,0.3); }

    .toggle-group { margin-top: 10px; border-top: 1px solid #e8eaed; padding-top: 10px; }
    .toggle-item { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #3c4043; font-weight: 500; }
    
    .info-card { margin-top: 10px; padding: 12px; background: #f8f9fa; border-radius: 8px; font-size: 13px; border-left: 4px solid #1a73e8; color: #3c4043; line-height: 1.4; }

    /* SOS Modal */
    .sos-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(234, 67, 53, 0.95); z-index: 9999; color: white; text-align: center; padding: 40px 20px; }
    .sos-overlay h1 { font-size: 28px; font-weight: 800; }
    .countdown-circle { font-size: 60px; font-weight: 900; margin: 24px auto; width: 120px; height: 120px; line-height: 110px; border: 4px solid white; border-radius: 50%; }
    .btn-cancel-sos { background: white; color: #ea4335; padding: 14px 28px; font-size: 16px; border-radius: 30px; border: none; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Top HUD Bar -->
  <div class="top-hud">
    <div class="hud-left">
      <button class="hud-btn" onclick="togglePanel()">⚙️ Menu / Route</button>
    </div>
    <div class="hud-right">
      <button class="hud-btn" onclick="recenterMap()">🎯 My Location</button>
    </div>
  </div>

  <div class="sos-overlay" id="sosModal">
    <h1>🚨 ACCIDENT DETECTED!</h1>
    <p>Crash detect ho gaya hai. Emergency 108 ambulance ko call lag rahi hai.</p>
    <div class="countdown-circle" id="countdownSec">10</div>
    <button class="btn-cancel-sos" onclick="cancelAccidentAlert()">MAIN SURAKSHIT HOON (CANCEL)</button>
  </div>

  <!-- Google Maps Style Control Panel -->
  <div class="control-panel" id="controlPanel">
    <div class="app-brand">
      <h2>🗺️ Life Cover - Navigation & Safety</h2>
    </div>
    
    <div class="input-group">
      <label>Start Location:</label>
      <input type="text" id="startLocation" value="My Live Location">
    </div>
    
    <div class="input-group">
      <label>Destination:</label>
      <input type="text" id="endLocation" value="Chandigarh">
    </div>

    <button class="btn btn-gps" onclick="startLiveTracking()">📍 Connect Live GPS Tracking</button>
    
    <div class="btn-grid">
      <button class="btn btn-main" onclick="calculateRoute(false)">🚀 Smart Route</button>
      <button class="btn btn-bypass" onclick="calculateRoute(true)">🛡️ Toll Free Bypass</button>
    </div>

    <div class="toggle-group">
      <div class="toggle-item">
        <span>💥 Smart Crash & Safety Guard</span>
        <input type="checkbox" id="toggleCrashDetection" checked onchange="toggleSensor()">
      </div>
    </div>

    <button class="btn btn-sos" onclick="triggerAccidentAlert()">🚨 MANUAL SOS (108 AMBULANCE)</button>

    <div class="info-card" id="routeInfo">
      Google Maps navigation aur safety guard active hain. Sahi route chunne ke liye upar button dabayein.
    </div>
  </div>

  <div id="map-wrapper">
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // Initialized Leaflet Map with Google Maps Standard Tile Layer
    const map = L.map('map', { zoomControl: false }).setView([28.6139, 77.2090], 15);

    // Google Maps Styled Tile Layer (Standard Roadmap)
    L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
      attribution: '© Google Maps'
    }).addTo(map);

    let userCoords = null;
    let userMarker = null;
    let watchId = null;
    let crashTimer = null;
    let currentRouteLayer = null;

    function togglePanel() {
      document.getElementById('controlPanel').classList.toggle('hidden');
    }

    function recenterMap() {
      if(userCoords) {
        map.setView(userCoords, 17, { animate: true });
      } else {
        alert("Pehle Live GPS Tracking connect karein.");
      }
    }

    function startLiveTracking() {
      if (navigator.geolocation) {
        if(watchId) navigator.geolocation.clearWatch(watchId);
        watchId = navigator.geolocation.watchPosition(
          pos => {
            userCoords = [pos.coords.latitude, pos.coords.longitude];
            if(!userMarker) {
              userMarker = L.marker(userCoords).addTo(map).bindPopup("Aapki Live Location");
            } else {
              userMarker.setLatLng(userCoords);
            }
            map.setView(userCoords, 16);
            document.getElementById('startLocation').value = "My Live Location";
          },
          err => { alert("Kripya GPS Location ki permission allow karein."); },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
        );
      }
    }

    startLiveTracking();

    async function fetchCoords(query) {
      if(query.trim() === "My Live Location" && userCoords) {
        return { lat: userCoords[0], lon: userCoords[1] };
      }
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
      const data = await res.json();
      if(data && data.length > 0) return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
      throw new Error("Location nahi mili.");
    }

    // Route Calculation with Toll-Free / Alternative Routing support
    async function calculateRoute(avoidTolls) {
      const infoBox = document.getElementById('routeInfo');
      try {
        infoBox.innerHTML = avoidTolls ? "🛡️ Toll-free rasta khoja ja raha hai..." : "🚀 Fastest rasta calculate ho raha hai...";
        
        const start = await fetchCoords(document.getElementById('startLocation').value);
        const end = await fetchCoords(document.getElementById('endLocation').value);

        let url = `https://router.project-osrm.org/route/v1/driving/${start.lon},${start.lat};${end.lon},${end.lat}?overview=full&geometries=geojson&alternatives=true`;

        const res = await fetch(url);
        const data = await res.json();

        if(data.routes && data.routes.length > 0) {
          // If avoidTolls is selected, choose alternative route index if available
          let routeIdx = (avoidTolls && data.routes.length > 1) ? 1 : 0;
          const route = data.routes[routeIdx];
          const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);

          if(currentRouteLayer) map.removeLayer(currentRouteLayer);

          const routeColor = avoidTolls ? '#34a853' : '#1a73e8'; // Google Green for Toll Free, Google Blue for Main
          currentRouteLayer = L.polyline(coords, { 
            color: routeColor, weight: 6, opacity: 0.85 
          }).addTo(map);

          map.fitBounds(currentRouteLayer.getBounds(), { padding: [50, 50] });

          const distKm = (route.distance/1000).toFixed(1);
          const timeMin = Math.round(route.duration/60);

          const routeTitle = avoidTolls ? '🛡️ Toll Free Bypass Route' : '🚀 Fastest Route';
          infoBox.innerHTML = `<b>${routeTitle}</b><br>Duri: ${distKm} km | Samay: ${timeMin} min`;
          
          if(window.innerWidth < 768) {
            setTimeout(() => togglePanel(), 1200);
          }
        }
      } catch(err) {
        infoBox.innerHTML = "❌ Route nahi mil paya. Sahi jagah ka naam daalein.";
      }
    }

    function toggleSensor() {
      if(document.getElementById('toggleCrashDetection').checked && window.DeviceMotionEvent) {
        window.addEventListener('devicemotion', handleMotion);
      }
    }

    function handleMotion(event) {
      const acc = event.accelerationIncludingGravity;
      if (acc && Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2) > 35) {
        triggerAccidentAlert();
      }
    }

    function triggerAccidentAlert() {
      document.getElementById('sosModal').style.display = 'block';
      let c = 10;
      document.getElementById('countdownSec').innerText = c;
      clearInterval(crashTimer);
      crashTimer = setInterval(() => {
        c--;
        document.getElementById('countdownSec').innerText = c;
        if (c <= 0) {
          clearInterval(crashTimer);
          window.location.href = `tel:108`;
        }
      }, 1000);
    }

    function cancelAccidentAlert() {
      clearInterval(crashTimer);
      document.getElementById('sosModal').style.display = 'none';
    }
  </script>
</body>
</html>
